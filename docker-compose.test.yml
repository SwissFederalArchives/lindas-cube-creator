services:
  fuseki:
    image: ghcr.io/zazuko/fuseki-geosparql:v2.0.3
    container_name: cc-test-fuseki
    environment:
      ADMIN_PASSWORD: password
    volumes:
      - ./fuseki/config.ttl:/fuseki/config.ttl
    ports:
      - "3030:3030"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3030/$$/ping || exit 1
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: cc-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: cc-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./test-data:/test-data:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio password;
      mc mb --ignore-existing local/cube-creator;
      mc cp /test-data/test-observations.csv local/cube-creator/test-data/test-observations.csv;
      echo 'Bucket and test data ready';
      exit 0;
      "

  mock-oidc:
    image: node:20-alpine
    container_name: cc-test-mock-oidc
    volumes:
      - ./test-data/mock-oidc.js:/app/mock-oidc.js:ro
    command: ["node", "/app/mock-oidc.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/.well-known/openid-configuration > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-proxy:
    image: nginx:alpine
    container_name: cc-test-api-proxy
    hostname: localhost
    volumes:
      - ./test-data/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        aliases:
          - api-proxy

  api:
    image: ghcr.io/swissfederalarchives/lindas-cube-creator-api:latest
    container_name: cc-test-api
    depends_on:
      fuseki:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
    volumes:
      - ./test-data/certs/cert.key:/certs/cert.key:ro
      - ./test-data/certs/cert.crt:/certs/cert.crt:ro
    ports:
      - "3000:45670"
    environment:
      NODE_ENV: development
      API_CORE_BASE: http://localhost:3000/
      UI_BASE: http://localhost:8080/app/
      AUTH_ISSUER: http://mock-oidc:8888
      AUTH_AUDIENCE: http://mock-oidc:8888
      AUTH_ACCESS_REQUEST: http://localhost:3000/access-request
      STORE_QUERY_ENDPOINT: http://fuseki:3030/cube-creator/query
      STORE_UPDATE_ENDPOINT: http://fuseki:3030/cube-creator/update
      STORE_GRAPH_ENDPOINT: http://fuseki:3030/cube-creator/data
      STORE_ENGINE: fuseki
      PUBLIC_QUERY_ENDPOINT: http://fuseki:3030/shared-dimensions
      TRIFID_UI: https://lindas.admin.ch/sparql
      VISUALIZE_UI: https://visualize.admin.ch
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: cube-creator
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: password
      PIPELINE_TYPE: local
      PIPELINE_URI: http://cli:80
      MANAGED_DIMENSIONS_GRAPH: https://lindas.admin.ch/cube/dimension
      MANAGED_DIMENSIONS_API_BASE: http://localhost:3000/
      MANAGED_DIMENSIONS_BASE: https://ld.admin.ch/cube/
      MANAGED_DIMENSIONS_STORE_QUERY_ENDPOINT: http://fuseki:3030/shared-dimensions/query
      MANAGED_DIMENSIONS_STORE_UPDATE_ENDPOINT: http://fuseki:3030/shared-dimensions/update
      MANAGED_DIMENSIONS_STORE_GRAPH_ENDPOINT: http://fuseki:3030/shared-dimensions/data
      MANAGED_DIMENSIONS_STORE_ENGINE: fuseki
      PX_CUBE_BASE: https://environment.ld.admin.ch/foen/example/px-cube/
      PX_CUBE_GRAPH: http://example.org/px-cube
      PX_CUBE_QUERY_ENDPOINT: http://fuseki:3030/px-cube/query
      PX_CUBE_GRAPH_ENDPOINT: http://fuseki:3030/px-cube/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:45670/', (r) => { process.exit(r.statusCode < 500 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    image: ghcr.io/swissfederalarchives/lindas-cube-creator-app:latest
    container_name: cc-test-app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      AUTH_ISSUER: http://mock-oidc:8888
      AUTH_CLIENT_ID: cube-creator
      API_CORE_BASE: http://localhost:3000/
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: test

  cli:
    image: ghcr.io/swissfederalarchives/lindas-cube-creator-cli:latest
    container_name: cc-test-cli
    entrypoint: ["sh", "-c", "mkdir -p /app/node_modules/dotenv && echo 'module.exports={config:function(){}}' > /app/node_modules/dotenv/index.js && PROXY_IP=$(getent hosts api-proxy | awk '{print $$1}') && sed -e \"s/127.0.0.1/$$PROXY_IP/\" -e '/::1.*localhost/d' /etc/hosts > /tmp/hosts_new && cat /tmp/hosts_new > /etc/hosts && node cli/server.js"]
    depends_on:
      fuseki:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
      api-proxy:
        condition: service_started
    ports:
      - "5000:80"
    environment:
      NODE_ENV: development
      DEBUG: "cube-creator*"
      API_CORE_BASE: http://api-proxy:3000/
      AUTH_RUNNER_ISSUER: http://mock-oidc:8888
      AUTH_RUNNER_CLIENT_ID: cli-service
      AUTH_RUNNER_CLIENT_SECRET: cli-secret
      STORE_QUERY_ENDPOINT: http://fuseki:3030/cube-creator/query
      STORE_UPDATE_ENDPOINT: http://fuseki:3030/cube-creator/update
      STORE_GRAPH_ENDPOINT: http://fuseki:3030/cube-creator/data
      STORE_ENGINE: fuseki
      GRAPH_STORE_ENDPOINT: http://fuseki:3030/cube-creator/data
      GRAPH_QUERY_ENDPOINT: http://fuseki:3030/cube-creator/query
      GRAPH_STORE_USER: admin
      GRAPH_STORE_PASSWORD: password
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: cube-creator
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: password
      MANAGED_DIMENSIONS_STORE_QUERY_ENDPOINT: http://fuseki:3030/shared-dimensions/query
      MANAGED_DIMENSIONS_STORE_UPDATE_ENDPOINT: http://fuseki:3030/shared-dimensions/update
      MANAGED_DIMENSIONS_STORE_GRAPH_ENDPOINT: http://fuseki:3030/shared-dimensions/data
      MANAGED_DIMENSIONS_STORE_ENGINE: fuseki
