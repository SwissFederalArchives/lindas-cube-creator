server {
  listen 80;
  server_name localhost;
  charset utf-8;

  # files transfer
  client_body_in_file_only clean;
  client_body_buffer_size 32K;
  client_max_body_size 1026g;
  sendfile on;
  send_timeout 300s;

  # redirect server error pages / and set response status to 200 / ok
  error_page 404 =200 /;

  root /usr/share/nginx/html;
  index index.html index.html;

  location / {
    try_files $uri /index.html =404;
  }

  # Proxy requests to "/auth" and "/api" to api-server.
  location ~ ^/(auth|api) {
    proxy_pass http://api:3000;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # deny access to .htaccess files, if Apache's document root concurs with nginx's one
  location ~ /\.ht {
    deny all;
  }

  # Allow access to .well-known
  location ~ ^/\.well-known {
    allow all;
    # If .well-known is handled by the API (e.g. openid-configuration), we might need to proxy it too.
    # But usually .well-known is for static files or specific protocols.
    # In this case, /auth/.well-known/openid-configuration is requested.
    # The /auth prefix is handled by the proxy block above.
    # So this block is for other .well-known paths if any.
    # However, the regex `~ ^/(auth|api)` takes precedence if defined before, or if it matches.
    # Nginx regex locations are checked in order.
    # The request is `/auth/.well-known/...`.
    # It matches `^/(auth|api)`.
    # So it should be proxied.
    # BUT, the original config had `location ~ /\. { deny all; }`.
    # If that block comes AFTER the proxy block, the proxy block should win if it matches.
    # Let's check the original config again.
  }

  # deny access to hidden files (beginning with a period)
  location ~ /\. {
      access_log off; log_not_found off; deny all;
  }
}
