name: Build and Push Docker Images

on:
  push:
    branches:
      - develop
    tags:
      - "lindas-cube-creator-app/v*.*.*"
      - "lindas-cube-creator-api/v*.*.*"
      - "lindas-cube-creator-cli/v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (test/int/prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - int
          - prod
      component:
        description: 'Component (app/api/cli/all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - app
          - api
          - cli

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.matrix }}
      environment: ${{ steps.environment.outputs.env }}
      api_version: ${{ steps.versions.outputs.api }}
      app_version: ${{ steps.versions.outputs.app }}
      cli_version: ${{ steps.versions.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine components to build
        id: components
        run: |
          if [[ "${{ github.event.inputs.component }}" == "all" ]] || [[ -z "${{ github.event.inputs.component }}" ]]; then
            echo 'matrix=["app","api","cli"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ github.event.inputs.component }}"]' >> $GITHUB_OUTPUT
          fi

      - name: Determine environment
        id: environment
        run: |
          if [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "env=test" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Read versions from package.json
        id: versions
        run: |
          echo "api=$(node -p "require('./apis/core/package.json').version")" >> $GITHUB_OUTPUT
          echo "app=$(node -p "require('./ui/package.json').version")" >> $GITHUB_OUTPUT
          echo "cli=$(node -p "require('./cli/package.json').version")" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.prepare.outputs.components) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get component version
        id: version
        run: |
          case "${{ matrix.component }}" in
            app) echo "version=${{ needs.prepare.outputs.app_version }}" >> $GITHUB_OUTPUT ;;
            api) echo "version=${{ needs.prepare.outputs.api_version }}" >> $GITHUB_OUTPUT ;;
            cli) echo "version=${{ needs.prepare.outputs.cli_version }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Determine image tags
        id: tags
        run: |
          COMPONENT="${{ matrix.component }}"
          VERSION="${{ steps.version.outputs.version }}"
          ENV="${{ needs.prepare.outputs.environment }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/lindas-cube-creator-${COMPONENT}"

          # Save current latest as previous (for rollback)
          echo "old_latest_tag=${IMAGE}:${ENV}-latest" >> $GITHUB_OUTPUT
          echo "previous_tag=${IMAGE}:${ENV}-previous" >> $GITHUB_OUTPUT

          if [[ "$ENV" == "test" ]]; then
            # Test images: test-1.15.3, test-latest
            TAGS="${IMAGE}:test-${VERSION},${IMAGE}:test-latest"
            echo "tags=${TAGS}" >> $GITHUB_OUTPUT
            echo "environment=test" >> $GITHUB_OUTPUT

          elif [[ "$ENV" == "int" ]]; then
            # Integration images: int-1.15.3, int-latest
            TAGS="${IMAGE}:int-${VERSION},${IMAGE}:int-latest"
            echo "tags=${TAGS}" >> $GITHUB_OUTPUT
            echo "environment=integration" >> $GITHUB_OUTPUT

          elif [[ "$ENV" == "prod" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Production images: prod-1.15.3, v1.15.3, 1.15.3, 1.15, 1, latest
            VERSION_MAJOR=$(echo $VERSION | cut -d. -f1)
            VERSION_MINOR=$(echo $VERSION | cut -d. -f1-2)
            TAGS="${IMAGE}:prod-${VERSION},${IMAGE}:v${VERSION},${IMAGE}:${VERSION},${IMAGE}:${VERSION_MINOR},${IMAGE}:${VERSION_MAJOR},${IMAGE}:latest"
            echo "tags=${TAGS}" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      - name: Pull current latest for rollback
        id: pull_previous
        continue-on-error: true
        run: |
          docker pull ${{ steps.tags.outputs.old_latest_tag }} || echo "No previous latest image found"

      - name: Build Docker image (temp tag) - app
        if: matrix.component == 'app'
        uses: docker/build-push-action@v5
        with:
          file: ./${{ matrix.component }}.Dockerfile
          context: .
          push: false
          load: true
          tags: lindas-cube-creator-${{ matrix.component }}:test-build
          build-args: |
            COMMIT=${{ github.sha }}
            PUBLIC_PATH=/app/
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            environment=${{ steps.tags.outputs.environment }}
            git.commit.sha=${{ github.sha }}
            git.branch=${{ github.ref_name }}

      - name: Build Docker image (temp tag) - api/cli
        if: matrix.component != 'app'
        uses: docker/build-push-action@v5
        with:
          file: ./${{ matrix.component }}.Dockerfile
          context: .
          push: false
          load: true
          tags: lindas-cube-creator-${{ matrix.component }}:test-build
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            environment=${{ steps.tags.outputs.environment }}
            git.commit.sha=${{ github.sha }}
            git.branch=${{ github.ref_name }}

      - name: Run smoke tests
        run: |
          chmod +x ./smoke-tests/${{ matrix.component }}-smoke.sh
          ./smoke-tests/${{ matrix.component }}-smoke.sh lindas-cube-creator-${{ matrix.component }}:test-build

      - name: Tag previous image (rollback support)
        if: steps.pull_previous.outcome == 'success'
        run: |
          docker tag ${{ steps.tags.outputs.old_latest_tag }} ${{ steps.tags.outputs.previous_tag }}
          docker push ${{ steps.tags.outputs.previous_tag }}

      - name: Push Docker image with all tags
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            docker tag lindas-cube-creator-${{ matrix.component }}:test-build "$tag"
            docker push "$tag"
          done

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        if: ${{ steps.tags.outputs.environment == 'production' && github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: zazuko
          SENTRY_PROJECT: lindas-cube-creator-${{ matrix.component }}
        with:
          version_prefix: lindas-cube-creator-${{ matrix.component }}@
          version: ${{ steps.version.outputs.version }}
          ignore_empty: true

      - name: Output image information
        run: |
          echo "## 🐳 Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Component:** ${{ matrix.component }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.tags.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
