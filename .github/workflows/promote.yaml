name: Promote and Rollback

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - promote
          - rollback-test
          - rollback-int
          - rollback-prod
        default: promote
      source_tag:
        description: "For promote/rollback-test: date portion (e.g., 2026-02-17_143022). For rollback-int/prod: full tag (e.g., int_2026-02-17_143022)"
        required: true
        type: string

env:
  API_IMAGE: ghcr.io/swissfederalarchives/lindas-cube-creator-api
  APP_IMAGE: ghcr.io/swissfederalarchives/lindas-cube-creator-app
  CLI_IMAGE: ghcr.io/swissfederalarchives/lindas-cube-creator-cli

jobs:
  # Promote to INT (retag all 3 images as int_*, no rebuild)
  move-to-int:
    if: github.ref == 'refs/heads/master' && inputs.action == 'promote'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create INT tag
        id: docker_tag
        run: echo "tag=int_$(date '+%Y-%m-%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Retag API image for INT
        run: |
          echo "Promoting API api-test_${{ inputs.source_tag }} to ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.API_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.API_IMAGE }}:api-test_${{ inputs.source_tag }}

      - name: Retag APP image for INT
        run: |
          echo "Promoting APP app-test_${{ inputs.source_tag }} to ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.APP_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.APP_IMAGE }}:app-test_${{ inputs.source_tag }}

      - name: Retag CLI image for INT
        run: |
          echo "Promoting CLI cli-test_${{ inputs.source_tag }} to ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.CLI_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.CLI_IMAGE }}:cli-test_${{ inputs.source_tag }}

  # Promote to PROD (retag all 3 images as prod_*, no rebuild)
  move-to-prod:
    if: github.ref == 'refs/heads/master' && inputs.action == 'promote'
    needs: move-to-int
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PROD tag
        id: docker_tag
        run: echo "tag=prod_$(date '+%Y-%m-%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Retag API image for PROD
        run: |
          echo "Promoting API api-test_${{ inputs.source_tag }} to ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.API_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.API_IMAGE }}:api-test_${{ inputs.source_tag }}

      - name: Retag APP image for PROD
        run: |
          echo "Promoting APP app-test_${{ inputs.source_tag }} to ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.APP_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.APP_IMAGE }}:app-test_${{ inputs.source_tag }}

      - name: Retag CLI image for PROD
        run: |
          echo "Promoting CLI cli-test_${{ inputs.source_tag }} to ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.CLI_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.CLI_IMAGE }}:cli-test_${{ inputs.source_tag }}

  # Rollback TEST (retag all 3 images with new test tags)
  rollback-test:
    if: github.ref == 'refs/heads/master' && inputs.action == 'rollback-test'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create TEST rollback tags
        id: docker_tag
        run: |
          DATESTAMP=$(date '+%Y-%m-%d_%H%M%S')
          echo "api_tag=api-test_${DATESTAMP}" >> "$GITHUB_OUTPUT"
          echo "app_tag=app-test_${DATESTAMP}" >> "$GITHUB_OUTPUT"
          echo "cli_tag=cli-test_${DATESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Retag API image for TEST
        run: |
          echo "Rolling back API to api-test_${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.api_tag }}"
          docker buildx imagetools create \
            --tag ${{ env.API_IMAGE }}:${{ steps.docker_tag.outputs.api_tag }} \
            ${{ env.API_IMAGE }}:api-test_${{ inputs.source_tag }}

      - name: Retag APP image for TEST
        run: |
          echo "Rolling back APP to app-test_${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.app_tag }}"
          docker buildx imagetools create \
            --tag ${{ env.APP_IMAGE }}:${{ steps.docker_tag.outputs.app_tag }} \
            ${{ env.APP_IMAGE }}:app-test_${{ inputs.source_tag }}

      - name: Retag CLI image for TEST
        run: |
          echo "Rolling back CLI to cli-test_${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.cli_tag }}"
          docker buildx imagetools create \
            --tag ${{ env.CLI_IMAGE }}:${{ steps.docker_tag.outputs.cli_tag }} \
            ${{ env.CLI_IMAGE }}:cli-test_${{ inputs.source_tag }}

  # Rollback INT (retag all 3 images with new int_* tag)
  rollback-int:
    if: github.ref == 'refs/heads/master' && inputs.action == 'rollback-int'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create INT rollback tag
        id: docker_tag
        run: echo "tag=int_$(date '+%Y-%m-%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Retag API image for INT
        run: |
          echo "Rolling back API to ${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.API_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.API_IMAGE }}:${{ inputs.source_tag }}

      - name: Retag APP image for INT
        run: |
          echo "Rolling back APP to ${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.APP_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.APP_IMAGE }}:${{ inputs.source_tag }}

      - name: Retag CLI image for INT
        run: |
          echo "Rolling back CLI to ${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.CLI_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.CLI_IMAGE }}:${{ inputs.source_tag }}

  # Rollback PROD (retag all 3 images with new prod_* tag)
  rollback-prod:
    if: github.ref == 'refs/heads/master' && inputs.action == 'rollback-prod'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PROD rollback tag
        id: docker_tag
        run: echo "tag=prod_$(date '+%Y-%m-%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Retag API image for PROD
        run: |
          echo "Rolling back API to ${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.API_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.API_IMAGE }}:${{ inputs.source_tag }}

      - name: Retag APP image for PROD
        run: |
          echo "Rolling back APP to ${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.APP_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.APP_IMAGE }}:${{ inputs.source_tag }}

      - name: Retag CLI image for PROD
        run: |
          echo "Rolling back CLI to ${{ inputs.source_tag }} as ${{ steps.docker_tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag ${{ env.CLI_IMAGE }}:${{ steps.docker_tag.outputs.tag }} \
            ${{ env.CLI_IMAGE }}:${{ inputs.source_tag }}
