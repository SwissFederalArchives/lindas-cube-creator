name: Deploy to INT

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., test-latest, test-1.0.0)'
        required: true
        type: string
        default: 'test-latest'
      component:
        description: 'Component to deploy'
        required: true
        type: choice
        options:
          - all
          - app
          - api
          - cli

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/swissfederalarchives/lindas-cube-creator

jobs:
  deploy:
    name: Deploy to INT
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine components
        id: components
        run: |
          if [[ "${{ github.event.inputs.component }}" == "all" ]]; then
            echo "components=app api cli" >> $GITHUB_OUTPUT
          else
            echo "components=${{ github.event.inputs.component }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy images
        run: |
          VERSION="${{ github.event.inputs.version }}"

          for component in ${{ steps.components.outputs.components }}; do
            IMAGE="${IMAGE_PREFIX}-${component}"

            echo "Deploying ${component} to INT..."

            # Save current graphdb-int-latest as graphdb-int-previous
            if docker pull ${IMAGE}:graphdb-int-latest 2>/dev/null; then
              echo "Saving current graphdb-int-latest as graphdb-int-previous"
              docker tag ${IMAGE}:graphdb-int-latest ${IMAGE}:graphdb-int-previous
              docker push ${IMAGE}:graphdb-int-previous
            else
              echo "No existing graphdb-int-latest tag to save"
            fi

            # Pull source image and retag as graphdb-int-latest
            echo "Pulling ${IMAGE}:${VERSION}"
            docker pull ${IMAGE}:${VERSION}
            docker tag ${IMAGE}:${VERSION} ${IMAGE}:graphdb-int-latest
            docker push ${IMAGE}:graphdb-int-latest

            echo "Tagged ${component}:${VERSION} as graphdb-int-latest"
          done

      - name: Summary
        run: |
          echo "## Deployed to INT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source version:** \`${{ github.event.inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Components:** ${{ steps.components.outputs.components }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|" >> $GITHUB_STEP_SUMMARY
          for component in ${{ steps.components.outputs.components }}; do
            echo "| ${component} | \`graphdb-int-latest\` |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To rollback: Run **Rollback** workflow with environment=graphdb-int" >> $GITHUB_STEP_SUMMARY
