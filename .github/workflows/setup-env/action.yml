name: "Env setup"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: "yarn"
    - run: yarn install --immutable
      shell: bash
    - name: Install Lando
      uses: lando/setup-lando@v3
      with:
        lando-version: 3.26.9
        config-file: .github/lando-ci.yml
    - name: Start site
      run: |
        if ! timeout 10m lando start -vvv; then
          echo "::warning::Lando failed to start; retrying once"
          timeout 10m lando start -vvv
        fi
      shell: bash
      env:
        DOCKER_BUILDKIT: "1"
    - name: Wait for site
      run: |
        timeout 90s bash -c \
          'until curl --fail --silent --insecure https://cube-creator.lndo.site/ping; do sleep 2; done'
      shell: bash
