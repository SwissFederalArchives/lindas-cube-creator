name: "Env setup"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: "yarn"
    - run: yarn install --immutable
      shell: bash
    - name: Install Lando
      uses: lando/setup-lando@v3
      with:
        lando-version: 3.26.9
        config-file: .github/lando-ci.yml
    - name: Start site
      run: |
        for attempt in 1 2; do
          if timeout 10m lando start -vvv; then
            exit 0
          fi

          echo "::group::Lando startup diagnostics (attempt ${attempt})"
          docker ps -a --filter label=com.docker.compose.project=cubecreator || true
          containers=$(docker ps -aq --filter label=com.docker.compose.project=cubecreator) || containers=""
          for container in $containers; do
            docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" || true
            docker logs --timestamps --tail 100 "$container" || true
          done
          echo "::endgroup::"

          if [ "$attempt" = 1 ]; then
            echo "::warning::Lando failed to start; retrying once"
          fi
        done
        exit 1
      shell: bash
      env:
        DOCKER_BUILDKIT: "1"
    - name: Wait for site
      run: |
        timeout 90s bash -c \
          'until curl --fail --silent --insecure https://cube-creator.lndo.site/ping; do sleep 2; done'
      shell: bash
