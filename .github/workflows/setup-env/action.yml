name: "Env setup"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: "yarn"
    - run: yarn install --immutable
      shell: bash
    - name: Start site
      uses: tpluscode/action-setup-lando@v0.1.5
      with:
        version: v3.11.0
        healthcheck: https://cube-creator.lndo.site/ping
        timeout: 90000
      env:
        DOCKER_BUILDKIT: "1"
