name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn workspace @cube-creator/ui lint

  unit-test:
    name: "Unit Tests"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn test
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/*.lcov

  smoke-test:
    name: "Smoke Tests (Docker)"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose -f docker-compose.e2e.yml build --parallel
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Start services
        run: |
          docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to be healthy (max 5 minutes)..."
          timeout 300 sh -c 'until [ $(docker compose -f docker-compose.e2e.yml ps --format json | grep -c "\"Health\":\"healthy\"") -ge 4 ]; do echo "Waiting... ($(docker compose -f docker-compose.e2e.yml ps --format json | grep -c "\"Health\":\"healthy\"") / 4 services healthy)"; sleep 5; done'
          echo "All services are healthy!"
          docker compose -f docker-compose.e2e.yml ps

      - name: Test API endpoints
        run: |
          curl -f http://localhost:3000/api/ || exit 1
          curl -f http://localhost:3000/api/cube-projects || exit 1

      - name: Test App endpoints
        run: |
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/app/ || exit 1

      - name: Test Fuseki
        run: |
          curl -f http://localhost:3030/$/ping || exit 1

      - name: Test MinIO
        run: |
          curl -f http://localhost:9000/minio/health/live || exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  e2e-tests:
    name: "E2E Tests"
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose -f docker-compose.e2e.yml build --parallel

      - name: Start services
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for API to be healthy..."
          timeout 300 sh -c 'until docker compose -f docker-compose.e2e.yml ps api | grep -q "healthy"; do echo "Waiting for API..."; sleep 5; done'
          echo "Waiting for App to be healthy..."
          timeout 300 sh -c 'until docker compose -f docker-compose.e2e.yml ps app | grep -q "healthy"; do echo "Waiting for App..."; sleep 5; done'
          echo "All services are healthy!"

      - name: Run Hydra E2E tests
        run: docker compose -f docker-compose.e2e.yml run --rm e2e-tests

      - name: Run UI E2E tests (Cypress)
        run: yarn workspace @cube-creator/ui test:e2e --url http://localhost:8080/app/ --headless
        env:
          TERM: xterm

      - name: Save Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            ui/tests/e2e/videos/*
            ui/tests/e2e/screenshots/*
          retention-days: 7

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  trigger-build:
    name: "Trigger Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, unit-test, smoke-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Docker Build Workflow
        run: |
          gh workflow run docker-build.yaml \
            -f environment=test \
            -f component=all \
            --ref develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  status:
    name: "CI Status Report"
    runs-on: ubuntu-latest
    needs: [lint, unit-test, smoke-test, e2e-tests]
    if: always()
    steps:
      - name: Report Status
        run: |
          echo "# CI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Required Tests (Must Pass)" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: **${{ needs.lint.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: **${{ needs.unit-test.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Tests (Docker): **${{ needs.smoke-test.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ℹ️ Informational Tests (Optional)" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          CRITICAL_PASS=true
          [[ "${{ needs.lint.result }}" != "success" ]] && CRITICAL_PASS=false
          [[ "${{ needs.unit-test.result }}" != "success" ]] && CRITICAL_PASS=false
          [[ "${{ needs.smoke-test.result }}" != "success" ]] && CRITICAL_PASS=false

          if [ "$CRITICAL_PASS" = true ]; then
            echo "✅ **DEPLOYMENT READY** - All tests passed!" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
              echo "🚀 Docker build triggered automatically" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **NOT READY** - Tests must pass before deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Required Tests:" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.lint.result }}" != "success" ]] && echo "- ❌ Lint" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.unit-test.result }}" != "success" ]] && echo "- ❌ Unit Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.smoke-test.result }}" != "success" ]] && echo "- ❌ Smoke Tests (Docker)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage:" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint**: Code quality and style" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests**: Isolated logic testing" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests**: Docker images build and services start correctly" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests**: Full user workflows (informational)" >> $GITHUB_STEP_SUMMARY
