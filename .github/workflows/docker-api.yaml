name: Build and push API Docker image

on:
  push:
    branches:
      - disabled-for-merge
    tags:
      - "lindas-cube-creator-api/v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-api-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-api-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: docker_meta
        with:
          images: ghcr.io/swissfederalarchives/lindas-cube-creator-api
          tags: |
            type=ref,event=branch
            type=raw,value=api-test_{{date 'YYYY-MM-DD_HHmmss'}},enable=${{ github.ref == 'refs/heads/master' }}
            type=match,pattern=lindas-cube-creator-api/v(.*),group=1,prefix=v
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          file: ./api.Dockerfile
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        if: ${{ github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: zazuko
          SENTRY_PROJECT: lindas-cube-creator-api
        with:
          version_prefix: lindas-cube-creator-api@
          ignore_empty: true
