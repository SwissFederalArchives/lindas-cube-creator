name: Propose organisation

on:
  workflow_dispatch:
    inputs:
      termdat_id:
        description: 'TERMDAT entry number (e.g. 3076 for BAG/FOPH)'
        required: true
        type: string
      namespace:
        description: 'Cube namespace, including trailing slash (e.g. https://health.ld.admin.ch/foph/)'
        required: true
        type: string
      publish_graph:
        description: 'Publishing graph (e.g. https://lindas.admin.ch/foph/cube)'
        required: true
        type: string
      observed_by:
        description: 'Organisation IRI, not the TERMDAT concept (e.g. https://ld.admin.ch/office/II.1.6)'
        required: true
        type: string
      profile_id:
        description: 'Profile ID; defaults to lowercase English TERMDAT abbreviation'
        type: string
      service_base:
        description: 'Public service base URL; defaults to namespace origin'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-organization
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test generator
        run: node --test tools/propose-organization.test.mjs
      - name: Generate profile from TERMDAT
        id: profile
        run: node tools/propose-organization.mjs
        env:
          TERMDAT_ID: ${{ inputs.termdat_id }}
          NAMESPACE: ${{ inputs.namespace }}
          PUBLISH_GRAPH: ${{ inputs.publish_graph }}
          OBSERVED_BY: ${{ inputs.observed_by }}
          PROFILE_ID: ${{ inputs.profile_id }}
          SERVICE_BASE: ${{ inputs.service_base }}
      - name: Create or update proposal PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: propose-organization/${{ steps.profile.outputs.profile_id }}
          title: 'Add publishing profile: ${{ steps.profile.outputs.profile_id }}'
          commit-message: 'Add publishing profile: ${{ steps.profile.outputs.profile_id }}'
          body-path: ${{ runner.temp }}/organization-proposal.md
          add-paths: apis/core/bootstrap/organizations.ts
