name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn workspace @cube-creator/ui lint

  unit-test:
    name: "Unit Tests"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        command:
          - test
          - test:queries
          - test:cli:rest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-env
      - run: yarn ${{ matrix.command }}
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/*.lcov
      - name: Collect logs on failure
        if: failure()
        run: lando logs -s core || true

  e2e-tests:
    name: "E2E Tests"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set e2e environment variables
        run: echo -e "\nVUE_APP_E2E=true\nVUE_APP_X_USER=john-doe\nVUE_APP_X_PERMISSION=pipelines:read,pipelines:write" >> .local.env
      - uses: ./.github/workflows/setup-env
      - name: Seed data
        run: yarn seed-data
      - name: Run Hydra E2E tests
        run: docker compose -f docker-compose.yml -f docker-compose.posix.yml run --rm e2e-tests
      - name: Run UI E2E tests (Cypress)
        run: yarn workspace @cube-creator/ui test:e2e --url https://app.cube-creator.lndo.site --headless
      - name: Save Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            ui/tests/e2e/videos/*
            ui/tests/e2e/screenshots/*
          retention-days: 7
      - name: Collect service logs on failure
        if: failure()
        run: |
          lando logs -s core || true
          lando logs -s pipeline || true

  pipeline:
    name: "Pipeline Tests"
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        command:
          - test:cli:transform
          - test:cli:publish
          - test:cli:import
          - test:cli:timeoutJobs
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-env
      - run: yarn ${{ matrix.command }}
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Collect logs on failure
        if: failure()
        run: lando logs || true

  trigger-build:
    name: "Trigger Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Docker Build Workflow
        run: |
          gh workflow run docker-build.yaml \
            -f environment=test \
            -f component=all \
            --ref develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  status:
    name: "CI Status Report"
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-tests, pipeline]
    if: always()
    steps:
      - name: Report Status
        run: |
          echo "# CI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Critical Tests (Must Pass for Deployment)" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: **${{ needs.lint.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: **${{ needs.unit-test.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: **${{ needs.e2e-tests.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ℹ️ Optional Tests (Informational)" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline Tests: ${{ needs.pipeline.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          CRITICAL_PASS=true
          [[ "${{ needs.lint.result }}" != "success" ]] && CRITICAL_PASS=false
          [[ "${{ needs.unit-test.result }}" != "success" ]] && CRITICAL_PASS=false
          [[ "${{ needs.e2e-tests.result }}" != "success" ]] && CRITICAL_PASS=false

          if [ "$CRITICAL_PASS" = true ]; then
            echo "✅ **DEPLOYMENT READY** - All critical tests passed!" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
              echo "🚀 Docker build triggered automatically" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **NOT READY** - Critical tests must pass before deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Critical Tests:" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.lint.result }}" != "success" ]] && echo "- ❌ Lint" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.unit-test.result }}" != "success" ]] && echo "- ❌ Unit Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.e2e-tests.result }}" != "success" ]] && echo "- ❌ E2E Tests" >> $GITHUB_STEP_SUMMARY
          fi
