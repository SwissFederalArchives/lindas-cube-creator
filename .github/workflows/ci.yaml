name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:

jobs:
  # ============================================
  # STAGE 1: FAST CHECKS (No Lando)
  # ============================================

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"
      - run: yarn install --prefer-offline
      - run: yarn lint
      - run: yarn workspace @cube-creator/ui lint

  # ============================================
  # STAGE 2: UNIT TESTS (2 concurrent Lando instances)
  # ============================================

  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-22.04
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        command:
          - test
          - test:queries
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-env
      - run: yarn ${{ matrix.command }}
        env:
          AUTH_RUNNER_CLIENT_SECRET: ${{ secrets.AUTH_RUNNER_CLIENT_SECRET }}
          AUTH_RUNNER_CLIENT_ID: ${{ secrets.AUTH_RUNNER_CLIENT_ID }}
          AUTH_RUNNER_ISSUER: ${{ secrets.AUTH_RUNNER_ISSUER }}
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/*.lcov
      - name: Collect logs on failure
        if: failure()
        run: lando logs -s core || true

  # ============================================
  # STAGE 3: PIPELINE TESTS (2 concurrent Lando instances at a time)
  # ============================================

  pipeline-tests-1:
    name: "Pipeline Tests (Batch 1)"
    runs-on: ubuntu-22.04
    needs: [unit-tests]
    strategy:
      fail-fast: false
      matrix:
        command:
          - test:cli:transform
          - test:cli:timeoutJobs
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-env
      - name: Verify Lando services are healthy
        run: |
          echo "Checking Lando service health..."
          lando info
          curl -fk https://cube-creator.lndo.site/ping || (echo "Core service not healthy" && exit 1)
      - run: yarn ${{ matrix.command }}
        env:
          AUTH_RUNNER_CLIENT_SECRET: ${{ secrets.AUTH_RUNNER_CLIENT_SECRET }}
          AUTH_RUNNER_CLIENT_ID: ${{ secrets.AUTH_RUNNER_CLIENT_ID }}
          AUTH_RUNNER_ISSUER: ${{ secrets.AUTH_RUNNER_ISSUER }}
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Lando Service Status ==="
          lando info || true
          echo "=== Core Service Logs ==="
          lando logs -s core || true
          echo "=== Pipeline Service Logs ==="
          lando logs -s pipeline || true

  pipeline-tests-2:
    name: "Pipeline Tests (Batch 2)"
    runs-on: ubuntu-22.04
    needs: [pipeline-tests-1]
    strategy:
      fail-fast: false
      matrix:
        command:
          - test:cli:publish
          - test:cli:import
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-env
      - name: Verify Lando services are healthy
        run: |
          echo "Checking Lando service health..."
          lando info
          curl -fk https://cube-creator.lndo.site/ping || (echo "Core service not healthy" && exit 1)
      - run: yarn ${{ matrix.command }}
        env:
          AUTH_RUNNER_CLIENT_SECRET: ${{ secrets.AUTH_RUNNER_CLIENT_SECRET }}
          AUTH_RUNNER_CLIENT_ID: ${{ secrets.AUTH_RUNNER_CLIENT_ID }}
          AUTH_RUNNER_ISSUER: ${{ secrets.AUTH_RUNNER_ISSUER }}
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Lando Service Status ==="
          lando info || true
          echo "=== Core Service Logs ==="
          lando logs -s core || true
          echo "=== Pipeline Service Logs ==="
          lando logs -s pipeline || true

  # ============================================
  # STAGE 4: INTEGRATION TESTS (Optional - 2 concurrent)
  # ============================================

  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-22.04
    needs: [pipeline-tests-2]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - e2e-api
          - e2e-ui
          - cli-rest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # E2E API Tests
      - name: Setup for E2E API tests
        if: matrix.test-suite == 'e2e-api'
        uses: ./.github/workflows/setup-env

      - name: Seed test data (E2E API)
        if: matrix.test-suite == 'e2e-api'
        run: yarn seed-data

      - name: Pre-flight health checks (E2E API)
        if: matrix.test-suite == 'e2e-api'
        run: |
          echo "=== Verifying Services ==="
          lando info
          echo "=== Testing API health ==="
          curl -fk https://cube-creator.lndo.site/ping || (echo "API not responding" && exit 1)
          echo "=== Testing SPARQL endpoint ==="
          curl -fk https://cube-creator.lndo.site/query || (echo "SPARQL not responding" && exit 1)

      - name: Run Hydra API tests
        if: matrix.test-suite == 'e2e-api'
        run: docker compose -f docker-compose.yml -f docker-compose.posix.yml run --rm e2e-tests

      # E2E UI Tests
      - name: Setup for E2E UI tests
        if: matrix.test-suite == 'e2e-ui'
        run: echo -e "\nVUE_APP_E2E=true\nVUE_APP_X_USER=john-doe\nVUE_APP_X_PERMISSION=pipelines:read,pipelines:write" >> .local.env

      - name: Setup Lando (E2E UI)
        if: matrix.test-suite == 'e2e-ui'
        uses: ./.github/workflows/setup-env

      - name: Seed test data (E2E UI)
        if: matrix.test-suite == 'e2e-ui'
        run: yarn seed-data

      - name: Pre-flight health checks (E2E UI)
        if: matrix.test-suite == 'e2e-ui'
        run: |
          echo "=== Testing UI application ==="
          curl -fk https://app.cube-creator.lndo.site/ || (echo "UI not responding" && exit 1)
          echo "=== Testing API backend ==="
          curl -fk https://cube-creator.lndo.site/ping || (echo "API not responding" && exit 1)

      - name: Run Cypress UI tests
        if: matrix.test-suite == 'e2e-ui'
        run: yarn workspace @cube-creator/ui test:e2e --url https://app.cube-creator.lndo.site --headless

      - name: Save Cypress artifacts
        if: matrix.test-suite == 'e2e-ui' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            ui/tests/e2e/videos/*
            ui/tests/e2e/screenshots/*
          retention-days: 7

      # CLI REST Tests
      - name: Setup for CLI REST tests
        if: matrix.test-suite == 'cli-rest'
        uses: ./.github/workflows/setup-env

      - name: Run CLI REST tests
        if: matrix.test-suite == 'cli-rest'
        run: yarn test:cli:rest
        env:
          AUTH_RUNNER_CLIENT_SECRET: ${{ secrets.AUTH_RUNNER_CLIENT_SECRET }}
          AUTH_RUNNER_CLIENT_ID: ${{ secrets.AUTH_RUNNER_CLIENT_ID }}
          AUTH_RUNNER_ISSUER: ${{ secrets.AUTH_RUNNER_ISSUER }}

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Lando Logs ==="
          lando logs || true
          if [ "${{ matrix.test-suite }}" == "e2e-api" ]; then
            echo "=== Docker Compose Services ==="
            docker compose -f docker-compose.yml -f docker-compose.posix.yml ps || true
            docker compose -f docker-compose.yml -f docker-compose.posix.yml logs || true
          fi

  # ============================================
  # DEPLOYMENT TRIGGER
  # ============================================

  trigger-build:
    name: "Trigger Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, pipeline-tests-1, pipeline-tests-2]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Docker Build Workflow
        run: |
          gh workflow run docker-build.yaml \
            -f environment=test \
            -f component=all \
            --ref develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # STATUS REPORT
  # ============================================

  status:
    name: "CI Status Report"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, pipeline-tests-1, pipeline-tests-2, integration-tests]
    if: always()
    steps:
      - name: Report Status
        run: |
          echo "# CI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Critical Tests (Must Pass for Deployment)" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: **${{ needs.lint.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: **${{ needs.unit-tests.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline Tests (Batch 1): **${{ needs.pipeline-tests-1.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline Tests (Batch 2): **${{ needs.pipeline-tests-2.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ℹ️ Optional Tests (Informational)" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          CRITICAL_PASS=true
          [[ "${{ needs.lint.result }}" != "success" ]] && CRITICAL_PASS=false
          [[ "${{ needs.unit-tests.result }}" != "success" ]] && CRITICAL_PASS=false
          [[ "${{ needs.pipeline-tests-1.result }}" != "success" ]] && CRITICAL_PASS=false
          [[ "${{ needs.pipeline-tests-2.result }}" != "success" ]] && CRITICAL_PASS=false

          if [ "$CRITICAL_PASS" = true ]; then
            echo "✅ **DEPLOYMENT READY** - All critical tests passed!" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
              echo "🚀 Docker build triggered automatically" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **NOT READY** - Critical tests must pass before deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Critical Tests:" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.lint.result }}" != "success" ]] && echo "- ❌ Lint" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.unit-tests.result }}" != "success" ]] && echo "- ❌ Unit Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.pipeline-tests-1.result }}" != "success" ]] && echo "- ❌ Pipeline Tests (Batch 1)" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.pipeline-tests-2.result }}" != "success" ]] && echo "- ❌ Pipeline Tests (Batch 2)" >> $GITHUB_STEP_SUMMARY
          fi
