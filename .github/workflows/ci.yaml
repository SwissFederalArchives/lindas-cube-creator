name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"
      - run: yarn install --frozen-lockfile --prefer-offline
      - run: yarn lint
      - run: yarn workspace @cube-creator/ui lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        command:
          - test
          - test:queries
          - test:cli:rest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-env
      - run: yarn ${{ matrix.command }}
        env:
          AUTH_RUNNER_CLIENT_SECRET: ${{ secrets.AUTH_RUNNER_CLIENT_SECRET }}
          AUTH_RUNNER_CLIENT_ID: ${{ secrets.AUTH_RUNNER_CLIENT_ID }}
          AUTH_RUNNER_ISSUER: ${{ secrets.AUTH_RUNNER_ISSUER }}
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/*.lcov
      - name: Collect logs on failure
        if: failure()
        run: lando logs -s core

  e2e-tests:
    name: E2E Tests (Lando)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set e2e environment variables
        run: echo -e "\nVUE_APP_E2E=true\nVUE_APP_X_USER=john-doe\nVUE_APP_X_PERMISSION=pipelines:read,pipelines:write" >> .local.env
      - uses: ./.github/workflows/setup-env
      - name: Seed data
        run: yarn seed-data
      - name: Run Hydra E2E tests
        run: docker compose -f docker-compose.yml -f docker-compose.posix.yml run e2e-tests
      - name: Run UI E2E tests (Cypress)
        run: yarn workspace @cube-creator/ui test:e2e --url https://app.cube-creator.lndo.site --headless
      - name: Save Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            ui/tests/e2e/videos/*
            ui/tests/e2e/screenshots/*
          retention-days: 7
      - name: Collect service logs on failure
        if: failure()
        run: |
          echo "## Core API Logs" >> $GITHUB_STEP_SUMMARY
          lando logs -s core || true
          echo "## Pipeline Logs" >> $GITHUB_STEP_SUMMARY
          lando logs -s pipeline || true

  pipeline-tests:
    name: Pipeline Tests
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        command:
          - test:cli:transform
          - test:cli:publish
          - test:cli:import
          - test:cli:timeoutJobs
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-env
      - run: yarn ${{ matrix.command }}
        env:
          AUTH_RUNNER_CLIENT_SECRET: ${{ secrets.AUTH_RUNNER_CLIENT_SECRET }}
          AUTH_RUNNER_CLIENT_ID: ${{ secrets.AUTH_RUNNER_CLIENT_ID }}
          AUTH_RUNNER_ISSUER: ${{ secrets.AUTH_RUNNER_ISSUER }}
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Collect logs on failure
        if: failure()
        run: lando logs
