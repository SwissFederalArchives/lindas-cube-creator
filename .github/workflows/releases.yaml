name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Prepeare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Create Release Pull Request
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        with:
          commit: "chore: release"
          title: "Merge to release"

  tags:
    name: Create tags
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Read versions and create tags
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          # Read current versions
          API_VERSION=$(node -p "require('./apis/core/package.json').version")
          APP_VERSION=$(node -p "require('./ui/package.json').version")
          CLI_VERSION=$(node -p "require('./cli/package.json').version")

          # Function to create tag if it doesn't exist
          create_tag() {
            local tag=$1
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag "$tag"
              git push origin "$tag"
              echo "✅ Created tag: $tag"
            else
              echo "⏭️  Tag already exists: $tag"
            fi
          }

          # Create tags for each component
          create_tag "lindas-cube-creator-api/v${API_VERSION}"
          create_tag "lindas-cube-creator-app/v${APP_VERSION}"
          create_tag "lindas-cube-creator-cli/v${CLI_VERSION}"

          echo "## 🏷️ Git Tags Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`lindas-cube-creator-api/v${API_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`lindas-cube-creator-app/v${APP_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`lindas-cube-creator-cli/v${CLI_VERSION}\`" >> $GITHUB_STEP_SUMMARY
