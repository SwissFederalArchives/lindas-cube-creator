name: E2E Tests

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (optional)'
        required: false
      skip_ui:
        description: 'Skip UI tests'
        type: boolean
        default: false

jobs:
  api-tests:
    name: API E2E Tests (Hypertest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose -f docker-compose.e2e.yml up -d fuseki minio api
          echo "Waiting for services to be ready..."
          timeout 360 bash -c 'until curl -f http://localhost:3000/api/; do sleep 5; done'

      - name: Run API E2E tests
        run: |
          docker compose -f docker-compose.e2e.yml run --rm e2e-tests
        env:
          BASE_URI: ${{ github.event.inputs.base_url || 'http://api:3000/' }}

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose -f docker-compose.e2e.yml logs api > logs/api.log
          docker compose -f docker-compose.e2e.yml logs fuseki > logs/fuseki.log
          docker compose -f docker-compose.e2e.yml logs minio > logs/minio.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-logs
          path: logs/

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  ui-tests:
    name: UI E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          yarn install --prefer-offline

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-x11 xvfb

      - name: Install Playwright browsers
        working-directory: e2e-ui
        run: |
          npx playwright install --with-deps chromium

      - name: Start services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose -f docker-compose.e2e.yml up -d
          echo "Waiting for services to be ready..."
          timeout 360 bash -c 'until curl -f http://localhost:8080/; do sleep 5; done'
          timeout 360 bash -c 'until curl -f http://localhost:3000/api/; do sleep 5; done'

      - name: Run Playwright tests
        working-directory: e2e-ui
        run: |
          npx playwright test --project=chromium
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:8080/app/' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-ui/playwright-report/
          retention-days: 30

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose -f docker-compose.e2e.yml logs > logs/all-services.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-logs
          path: logs/

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

