name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - test
          - int
          - prod
      component:
        description: 'Component to rollback'
        required: true
        type: choice
        options:
          - all
          - app
          - api
          - cli

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine components
        id: components
        run: |
          if [[ "${{ github.event.inputs.component }}" == "all" ]]; then
            echo "components=app api cli" >> $GITHUB_OUTPUT
          else
            echo "components=${{ github.event.inputs.component }}" >> $GITHUB_OUTPUT
          fi

      - name: Rollback images
        run: |
          ENV="${{ github.event.inputs.environment }}"

          for component in ${{ steps.components.outputs.components }}; do
            IMAGE="ghcr.io/${{ github.repository_owner }}/lindas-cube-creator-${component}"

            echo "Rolling back ${component}..."

            # Check if previous tag exists
            if docker manifest inspect ${IMAGE}:${ENV}-previous >/dev/null 2>&1; then
              # Pull previous image
              docker pull ${IMAGE}:${ENV}-previous

              # Backup current latest as failed
              docker pull ${IMAGE}:${ENV}-latest || true
              docker tag ${IMAGE}:${ENV}-latest ${IMAGE}:${ENV}-failed || true
              docker push ${IMAGE}:${ENV}-failed || true

              # Promote previous to latest
              docker tag ${IMAGE}:${ENV}-previous ${IMAGE}:${ENV}-latest
              docker push ${IMAGE}:${ENV}-latest

              echo "✅ Rolled back ${component} to previous version"
            else
              echo "❌ No previous image found for ${component}"
              exit 1
            fi
          done

      - name: Create rollback summary
        run: |
          echo "## 🔄 Rollback Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Components:** ${{ steps.components.outputs.components }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The \`previous\` images have been promoted to \`latest\`." >> $GITHUB_STEP_SUMMARY
          echo "The old \`latest\` images are now tagged as \`failed\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify the rollback worked" >> $GITHUB_STEP_SUMMARY
          echo "2. Investigate the issue with the failed version" >> $GITHUB_STEP_SUMMARY
          echo "3. Deploy a fix" >> $GITHUB_STEP_SUMMARY
