name: cube-creator
env_file:
  - .local.env
  - .env
services:
  core:
    type: node:custom
    command: install -d -o node -g node /var/www/.npm-global /var/www/.npm-global/lib && npx nodemon -w packages -w apis --verbose --ext ts,ttl,js,trig --ignore **/*.test.ts --ignore **/*.spec-graphs.ts --exec node -r ts-node/register apis/core/index.ts
    port: 45670
    ssl: true
    sslExpose: false
    scanner: false
    overrides:
      image: node:18
      environment:
        TS_NODE_TRANSPILE_ONLY: "true"
        TS_NODE_PROJECT: apis/core/tsconfig.json
        # This should be kept in sync with api.Dockerfile
        DEBUG: creator*,hydra*,hydra-box*,labyrinth*,dimensions*
      depends_on:
        store:
          condition: service_healthy
        s3-init:
          condition: service_healthy
  ui:
    type: node:custom
    command: (cd ui; yarn serve --public app.cube-creator.lndo.site --hostname 0.0.0.0 --port 80)
    ssl: true
    sslExpose: false
    overrides:
      image: node:18
      environment:
        NO_WEBSOCKET: "true"
  store:
    type: compose
    ssl: true
    sslExpose: false
    build_as_root:
      - /opt/java-minimal/bin/keytool -importcert -trustcacerts -noprompt -storepass changeit -cacerts -file /lando/certs/LandoCA.crt -alias LandoCert
    services:
      image: ghcr.io/zazuko/fuseki-geosparql:v2.0.3
      command: /opt/fuseki/entrypoint.sh
      user: root
      ports:
        - "3030:3030"
      environment:
        ADMIN_PASSWORD: password
        OTEL_SERVICE_NAME: store
        OTEL_TRACES_EXPORTER: jaeger
        OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14250
        OTEL_PROPAGATORS: tracecontext,jaeger
      volumes:
        - ./fuseki/config.ttl:/fuseki/config.ttl
      healthcheck:
        test: wget --no-verbose --tries=1 --spider http://localhost:3030/$$/ping || exit 1
        interval: 5s
        timeout: 3s
        retries: 10
      depends_on:
        - collector
  trifid:
    type: compose
    app_mount: false
    ssl: true
    sslExpose: false
    scanner: false
    services:
      image: ghcr.io/zazuko/trifid:v2
      user: root
      command: tini -- /app/server.js --config=/config-sparql.json --sparql-endpoint-url=http://admin:password@db.cube-creator.lndo.site/cube-creator
      environment:
        DEBUG: "trifid*"
  s3:
    type: compose
    app_mount: false
    ssl: true
    sslExpose: false
    scanner: false
    overrides:
      entrypoint: /usr/bin/docker-entrypoint.sh
    services:
      image: quay.io/minio/minio:RELEASE.2023-09-30T07-02-29Z
      command: server /data
      environment:
        MINIO_ROOT_USER: minio
        MINIO_ROOT_PASSWORD: password
      volumes:
        - minio-data:/data
        - ./docker/minio/update-ca-certificates:/usr/local/bin/update-ca-certificates:ro
      healthcheck:
        test: ["CMD", "mc", "ready", "local"]
        interval: 2s
        timeout: 2s
        retries: 30
      networks:
        - default
        - landonet
    networks:
      landonet:
        name: lando_bridge_network
        external: true
    volumes:
      minio-data:
  s3-init:
    type: compose
    app_mount: false
    scanner: false
    overrides:
      entrypoint: /bin/sh
    services:
      image: quay.io/minio/mc:RELEASE.2023-09-29T16-41-22Z
      command: -c 'until mc alias set local http://s3:9000 minio password; do sleep 2; done; mc mb --ignore-existing local/cube-creator; mc mirror --overwrite /fixtures local/cube-creator; touch /tmp/ready; exec tail -f /dev/null'
      depends_on:
        s3:
          condition: service_healthy
      volumes:
        - ./minio/cube-creator:/fixtures:ro
      healthcheck:
        test: ["CMD-SHELL", "test -f /tmp/ready"]
        interval: 2s
        timeout: 2s
        retries: 30
  pipeline:
    type: node:custom
    command: install -d -o node -g node /var/www/.npm-global /var/www/.npm-global/lib && npx nodemon -w packages -w cli --verbose --ext ts,ttl,js,trig --ignore **/*.spec.ts --ignore **/*.spec-graphs.ts --exec node -r ts-node/register cli/server.ts
    port: 80
    scanner: false
    overrides:
      image: node:18
      environment:
        TS_NODE_TRANSPILE_ONLY: "true"
        NODE_TLS_REJECT_UNAUTHORIZED: 0
  collector:
    type: compose
    scanner: false
    services:
      build:
        context: ./otel
        dockerfile: .Dockerfile
      command: /otel/otelcol --config=/collector.yaml
      ports:
        - 55681:55681
        - 8889:8889
      volumes:
        - ./otel/collector.yaml:/collector.yaml:ro
      depends_on:
        jaeger:
          condition: service_healthy
  jaeger:
    type: compose
    scanner: false
    services:
      image: jaegertracing/all-in-one:1.42
      command: /go/bin/all-in-one-linux --sampling.strategies-file=/etc/jaeger/sampling_strategies.json
      healthcheck:
        test: wget -nv -t1 --spider localhost:14269/ || exit 1
        interval: 5s
        timeout: 3s
        retries: 10
  prometheus:
    type: compose
    scanner: false
    services:
      image: prom/prometheus:v2.33.4
      command: /bin/prometheus --config.file=/prometheus.yaml --web.enable-lifecycle
      volumes:
        - ./otel/prometheus.yaml:/prometheus.yaml:ro

proxy:
  store:
    - db.cube-creator.lndo.site:3030
  trifid:
    - trifid.cube-creator.lndo.site:8080
  core:
    - cube-creator.lndo.site:45670
  ui:
    - app.cube-creator.lndo.site
  s3:
    - s3.cube-creator.lndo.site:9000
  pipeline:
    - pipeline.cube-creator.lndo.site
  collector:
    - otel.cube-creator.lndo.site:55681
  jaeger:
    - jaeger.cube-creator.lndo.site:16686
  prometheus:
    - prometheus.cube-creator.lndo.site:9090
