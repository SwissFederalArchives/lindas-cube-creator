services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: test
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT:-http://fuseki:3030/cube-creator}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-cube-creator}
      AWS_ACCESS_KEY_ID: ${E2E_S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${E2E_S3_SECRET_KEY:-minioadmin}
      ALLOW_ORIGIN: "*"
    depends_on:
      fuseki:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3000/api/ && curl -sf http://localhost:3000/api/cube-projects"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: app.Dockerfile
      args:
        PUBLIC_PATH: /app/
        COMMIT: test
    ports:
      - "8080:80"
    environment:
      API_CORE_BASE: http://api:3000/api/
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider -q http://localhost:80/ && wget --spider -q http://localhost:80/app/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  cli:
    build:
      context: .
      dockerfile: cli.Dockerfile
    environment:
      NODE_ENV: test
      API_CORE_BASE: http://api:3000/api/
      SPARQL_ENDPOINT: http://fuseki:3030/cube-creator
    depends_on:
      api:
        condition: service_healthy

  fuseki:
    image: ghcr.io/zazuko/fuseki-geosparql:v2.0.3
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: ${E2E_FUSEKI_PASSWORD:-admin}
      FUSEKI_DATASET_1: cube-creator
      JVM_ARGS: "-Xmx3g"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:3030/$$/ping && wget --no-verbose --tries=1 --spider http://localhost:3030/cube-creator/query"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    volumes:
      - fuseki-data:/fuseki

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${E2E_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${E2E_MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - minio-data:/data

  e2e-tests:
    image: hydrofoil/hypertest:0.6.7
    environment:
      BASE_URI: http://api:3000/
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - ./e2e-tests:/tests
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - test

volumes:
  fuseki-data:
  minio-data:
