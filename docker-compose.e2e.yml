services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: test
      # Core API Base URL
      API_CORE_BASE: ${API_CORE_BASE:-http://localhost:3000/}
      UI_BASE: ${UI_BASE:-http://localhost:8080/app/}
      # SPARQL Store Configuration
      STORE_QUERY_ENDPOINT: ${STORE_QUERY_ENDPOINT:-http://fuseki:3030/cube-creator/query}
      STORE_UPDATE_ENDPOINT: ${STORE_UPDATE_ENDPOINT:-http://fuseki:3030/cube-creator/update}
      STORE_GRAPH_ENDPOINT: ${STORE_GRAPH_ENDPOINT:-http://fuseki:3030/cube-creator/data}
      STORE_ENGINE: ${STORE_ENGINE:-fuseki}
      # S3/MinIO Configuration
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-cube-creator}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      # Pipeline Configuration
      PIPELINE_TYPE: ${PIPELINE_TYPE:-local}
      PIPELINE_URI: ${PIPELINE_URI:-http://localhost:5000}
      # Public Endpoints
      PUBLIC_QUERY_ENDPOINT: ${PUBLIC_QUERY_ENDPOINT:-http://fuseki:3030/cube-creator/query}
      TRIFID_UI: ${TRIFID_UI:-https://lindas.admin.ch/sparql}
      VISUALIZE_UI: ${VISUALIZE_UI:-https://visualize.admin.ch}
      # CORS
      ALLOW_ORIGIN: "*"
      # Shared Dimensions environment variables
      MANAGED_DIMENSIONS_GRAPH: ${MANAGED_DIMENSIONS_GRAPH:-http://example.org/dimensions}
      MANAGED_DIMENSIONS_API_BASE: ${MANAGED_DIMENSIONS_API_BASE:-http://localhost:3000/}
      MANAGED_DIMENSIONS_BASE: ${MANAGED_DIMENSIONS_BASE:-http://example.org/}
      MANAGED_DIMENSIONS_STORE_QUERY_ENDPOINT: ${MANAGED_DIMENSIONS_STORE_QUERY_ENDPOINT:-http://fuseki:3030/cube-creator/query}
      MANAGED_DIMENSIONS_STORE_UPDATE_ENDPOINT: ${MANAGED_DIMENSIONS_STORE_UPDATE_ENDPOINT:-http://fuseki:3030/cube-creator/update}
      MANAGED_DIMENSIONS_STORE_GRAPH_ENDPOINT: ${MANAGED_DIMENSIONS_STORE_GRAPH_ENDPOINT:-http://fuseki:3030/cube-creator/data}
      MANAGED_DIMENSIONS_STORE_ENGINE: ${MANAGED_DIMENSIONS_STORE_ENGINE:-fuseki}
    depends_on:
      fuseki:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: app.Dockerfile
      args:
        PUBLIC_PATH: /app/
        COMMIT: test
    ports:
      - "8080:80"
    environment:
      API_CORE_BASE: http://api:3000/api/
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider -q http://localhost:80/ && wget --spider -q http://localhost:80/app/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  cli:
    build:
      context: .
      dockerfile: cli.Dockerfile
    environment:
      NODE_ENV: test
      API_CORE_BASE: http://api:3000/api/
      SPARQL_ENDPOINT: http://fuseki:3030/cube-creator
    depends_on:
      api:
        condition: service_healthy

  fuseki:
    image: ghcr.io/zazuko/fuseki-geosparql:v2.0.3
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: ${E2E_FUSEKI_PASSWORD:-admin}
      JVM_ARGS: "-Xmx3g"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3030/$$/ping"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    volumes:
      - fuseki-data:/fuseki
      - ./fuseki/config.ttl:/fuseki/config.ttl:ro

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${E2E_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${E2E_MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 5;
      mc alias set local http://minio:9000 $${E2E_MINIO_USER:-minioadmin} $${E2E_MINIO_PASSWORD:-minioadmin};
      mc mb -p local/cube-creator || true;
      exit 0;
      "
    environment:
      E2E_MINIO_USER: ${E2E_MINIO_USER:-minioadmin}
      E2E_MINIO_PASSWORD: ${E2E_MINIO_PASSWORD:-minioadmin}

  e2e-tests:
    image: hydrofoil/hypertest:0.6.7
    environment:
      BASE_URI: http://api:3000/
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - ./e2e-tests:/tests
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - test

volumes:
  fuseki-data:
  minio-data:
